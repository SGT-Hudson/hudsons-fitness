# Supabase local config — used for the Tier-3 pgTAP test DB
# (`supabase start` + `supabase test db`). Production is managed via the
# dashboard/MCP; the one deploy-time setting read from here is `verify_jwt`
# for the edge functions (the `[functions.*]` blocks at the end), which
# `supabase functions deploy` applies. See
# docs/superpowers/specs/2026-06-03-tier3-pgtap-ci-design.md.
#
# Kept intentionally minimal: only project_id + the Postgres major version
# (matching prod — `get_project` reports 17.6.x). Everything else defaults;
# CI trims the heavy, flaky services via `supabase start -x ...` rather than
# config toggles, so this file stays robust across CLI versions.

project_id = "hudsons-fitness"

# Ports moved out of the CLI defaults (2026-07-19) so this stack can run at the
# same time as financial-advisor, which sits on the 543xx defaults. Without this,
# `supabase start` here fails while that project is up — the two collide on
# every default port, not just the DB one. The range is 563xx, not the 553xx
# first chosen: Windows reserves 55167-55466 on this machine for Hyper-V, so
# nothing there could bind either.
#
# This is the one deliberate exception to the "keep it minimal" rule above:
# ports are a machine-level coexistence concern, not a service toggle, and the
# keys are stable across CLI versions.

[api]
port = 56321

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
port = 56329

[studio]
port = 56323

[inbucket]
port = 56324

[analytics]
port = 56327

# Edge functions called by pg_cron (`private.invoke_edge_function`). The cron
# sends a `sb_secret_` key on the `apikey` header; it is not a JWT, so the
# gateway's JWT check is off for these and each function checks the key in
# code (`isServerCall`, supabase/functions/_shared/keys.ts). Never turn
# verify_jwt off for a function without that check: it would be public.
# Guarded by supabase/functions/_shared/cron-auth-wiring.test.ts.
# `delete-account` is called by signed-in users and keeps the default (true).

[functions.cron-healthcheck]
verify_jwt = false

[functions.daily-nutrition-snapshot]
verify_jwt = false

[functions.recalculate-tdee]
verify_jwt = false

[functions.recipe-photo-reap]
verify_jwt = false

[functions.weekly-rollover]
verify_jwt = false
