# Supabase local config — used only for the Tier-3 pgTAP test DB
# (`supabase start` + `supabase test db`). Production is managed via the
# dashboard/MCP; this file is NOT a deploy surface. See
# docs/superpowers/specs/2026-06-03-tier3-pgtap-ci-design.md.
#
# Kept intentionally minimal: only project_id + the Postgres major version
# (matching prod — `get_project` reports 17.6.x). Everything else defaults;
# CI trims the heavy, flaky services via `supabase start -x ...` rather than
# config toggles, so this file stays robust across CLI versions.

project_id = "hudsons-fitness"

# Ports moved out of the CLI defaults (2026-07-19) so this stack can run at the
# same time as financial-advisor, which sits on the 543xx defaults. Without this,
# `supabase start` here fails while that project is up — the two collide on
# every default port, not just the DB one. The range is 563xx, not the 553xx
# first chosen: Windows reserves 55167-55466 on this machine for Hyper-V, so
# nothing there could bind either.
#
# This is the one deliberate exception to the "keep it minimal" rule above:
# ports are a machine-level coexistence concern, not a service toggle, and the
# keys are stable across CLI versions.

[api]
port = 56321

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
port = 56329

[studio]
port = 56323

[inbucket]
port = 56324

[analytics]
port = 56327
