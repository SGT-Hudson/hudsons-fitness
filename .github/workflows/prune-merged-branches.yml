name: prune-merged-branches

# `delete_branch_on_merge` and a `pull_request: closed` workflow both fail to
# delete branches when GitHub's auto-merge bot completes the merge (events
# from the GITHUB_TOKEN-enabled auto-merge do not trigger workflows). A
# SCHEDULED run is time-triggered, so it is immune to that limitation. This
# deletes `claude/*` branches whose PR is merged. Never touches
# main/develop/release/* (not matched by the `claude/` filter).
on:
  schedule:
    - cron: '17 4 * * *' # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged claude/* branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/branches" --paginate --jq '.[].name' \
            | grep -E '^claude/' \
            | while read -r br; do
                # --repo is required: this job has no checkout, so gh would
                # otherwise shell to git for repo context and fail.
                state=$(gh pr list --repo "$REPO" --head "$br" --state all --json state --jq '.[0].state // "NONE"')
                if [ "$state" = "MERGED" ]; then
                  echo "pruning merged branch: $br"
                  gh api -X DELETE "repos/$REPO/git/refs/heads/$br" || true
                else
                  echo "keep $br (PR state: $state)"
                fi
              done
