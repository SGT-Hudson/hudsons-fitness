name: delete-merged-branch

# `delete_branch_on_merge` does not fire when GitHub's auto-merge bot
# completes the merge, so merged feature branches accumulate. This deletes
# the head branch on PR merge. Hard guards: never main/develop (the
# backmerge PR's head IS main — must never be deleted), never fork branches.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${HEAD_REF}" || true
