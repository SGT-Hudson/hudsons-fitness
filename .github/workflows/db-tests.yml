name: DB reproducibility (R-00, manual)

# The Tier-3 pgTAP suite now runs as the blocking `db-test` job in ci.yml.
# This manual workflow keeps the R-00 reproducibility check, which diffs a
# from-zero `supabase db reset` against the linked production schema and needs
# the SUPABASE_ACCESS_TOKEN secret — so it stays opt-in (dispatch only) rather
# than gating every PR. Run it after schema changes to confirm the migration
# history still reproduces prod.
on:
  workflow_dispatch:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: R-00 reproducibility check (db reset vs linked prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref upvraruehzurbetzrxov
          bash scripts/db-reproducibility-check.sh
