name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel superseded in-flight runs on the same ref for PRs (a new push
# obsoletes the old run), but let push runs on main/develop finish — every
# protected-branch commit deserves a full build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # Tier-1 tests (D-F1 ruling, R-16): pure-logic unit tests via Vitest.
      - run: pnpm test

  # Deno-side guard for the edge functions. The Vitest parity suite
  # (supabase/functions/_shared/macros.test.ts) runs under Node and only
  # covers the pure shared core; this catches Deno-runtime breakage (bad
  # esm.sh imports, Deno API misuse, TS errors in function entrypoints) that
  # the Node path structurally cannot. Advisory for now — NOT yet a required
  # status check; promote to required once it has proven reliably green.
  edge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno lint + type-check edge functions
        working-directory: supabase/functions
        run: |
          deno lint
          deno check $(git ls-files '*.ts')
