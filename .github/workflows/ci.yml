name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel superseded in-flight runs on the same ref for PRs (a new push
# obsoletes the old run), but let push runs on main/develop finish — every
# protected-branch commit deserves a full build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # Tier-1 tests (D-F1 ruling, R-16): pure-logic unit tests via Vitest.
      - run: pnpm test

  # Deno-side guard for the edge functions. `deno lint` covers every function
  # (syntactic — resolves no imports, so the Vitest parity test is fine).
  # `deno check` is scoped to the D-F3/R-17 shared-core import chain only:
  # the non-test `_shared/*.ts` pulls in src/core/*, proving that boundary
  # stays Deno-resolvable — the exact silent-breakage class (an `@/` Vite
  # alias creeping into the shared core) that Node/Vitest cannot catch.
  # Full per-entrypoint `deno check` is deferred: the function bodies have
  # pre-existing supabase-js generic strictness under Deno (runtime-harmless —
  # prod crons work). Tracked follow-up before promoting this to a required
  # status check.
  edge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno lint (all functions) + type-check (shared-core chain)
        run: |
          deno lint --config supabase/functions/deno.json supabase/functions
          deno check --config supabase/functions/deno.json \
            $(git ls-files 'supabase/functions/_shared/*.ts' | grep -v '\.test\.ts$')

  # Tier-3 (R-16 / D-F1): DB/RLS/RPC tests via pgTAP against a real Postgres.
  # `supabase start` stands up the local stack (Postgres image with pgTAP +
  # the auth schema + pg_cron/pg_net/vault) and applies the full migration
  # history from zero — so this also guards that migrations apply cleanly and
  # idempotently. `supabase test db` runs supabase/tests/*.test.sql.
  # It also runs Tier-4 (R-32): the real fetch helpers against this stack, so an
  # invalid `.select(...)` string fails here rather than in production.
  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Start local stack (applies all migrations)
        # Exclude the heavy/flaky services not needed for pgTAP. gotrue (auth)
        # stays — it creates the auth schema + auth.uid() the RLS tests rely on.
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Run pgTAP suite
        run: supabase test db

      # Tier-4 (R-32): the client's PostgREST select strings, run against the
      # stack this job already started. Node/pnpm are set up here rather than
      # in a new job so the stack is not stood up twice.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Tier-4 select-string guard
        run: |
          eval "$(supabase status -o env | sed -n 's/^ANON_KEY=/SUPABASE_TEST_ANON_KEY=/p')"
          export SUPABASE_TEST_ANON_KEY
          pnpm test:integration

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
